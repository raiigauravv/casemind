<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CaseMind — Architecture</text>

  <!-- S3 input -->
  <rect x="20" y="60" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="110" y="84" text-anchor="middle" font-size="12" fill="#92400e">New case/txn</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#92400e">lands in S3 (event trigger)</text>

  <!-- API Gateway input -->
  <rect x="220" y="60" width="180" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="310" y="84" text-anchor="middle" font-size="12" fill="#92400e">POST /cases via</text>
  <text x="310" y="100" text-anchor="middle" font-size="12" fill="#92400e">AWS API Gateway (HTTP API)</text>

  <!-- Lambda -->
  <rect x="330" y="150" width="240" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="450" y="176" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">AWS Lambda</text>
  <text x="450" y="194" text-anchor="middle" font-size="12" fill="#1e3a8a">(agent orchestration loop)</text>

  <line x1="110" y1="120" x2="410" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="120" x2="440" y2="148" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three branches -->
  <rect x="30" y="270" width="230" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CockroachDB Managed MCP</text>
  <text x="145" y="312" text-anchor="middle" font-size="11" fill="#14532d">read-only select_query tool</text>
  <text x="145" y="328" text-anchor="middle" font-size="11" fill="#14532d">for entity/decision history</text>
  <text x="145" y="344" text-anchor="middle" font-size="11" fill="#14532d">(scoped service-account key;</text>
  <text x="145" y="360" text-anchor="middle" font-size="11" fill="#14532d">falls back to direct SQL if</text>
  <text x="145" y="376" text-anchor="middle" font-size="11" fill="#14532d">MCP creds aren't configured)</text>

  <rect x="285" y="270" width="230" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CockroachDB</text>
  <text x="400" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Distributed Vector Index</text>
  <text x="400" y="334" text-anchor="middle" font-size="11" fill="#14532d">semantic search over similar</text>
  <text x="400" y="350" text-anchor="middle" font-size="11" fill="#14532d">case narratives (VECTOR column</text>
  <text x="400" y="366" text-anchor="middle" font-size="11" fill="#14532d">+ &lt;-&gt; L2 distance operator)</text>

  <rect x="540" y="270" width="230" height="130" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="655" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CockroachDB direct SQL</text>
  <text x="655" y="312" text-anchor="middle" font-size="11" fill="#14532d">(psycopg) — transactional</text>
  <text x="655" y="328" text-anchor="middle" font-size="11" fill="#14532d">writes: case status, decision</text>
  <text x="655" y="344" text-anchor="middle" font-size="11" fill="#14532d">+ audit trail (retrieved_case_ids)</text>

  <line x1="400" y1="210" x2="160" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="420" y1="210" x2="400" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="470" y1="210" x2="640" y2="268" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Bedrock -->
  <rect x="330" y="430" width="240" height="80" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Amazon Bedrock</text>
  <text x="450" y="472" text-anchor="middle" font-size="11" fill="#4c1d95">Claude Haiku 4.5 reasoning +</text>
  <text x="450" y="488" text-anchor="middle" font-size="11" fill="#4c1d95">Titan embeddings, informed by</text>
  <text x="450" y="504" text-anchor="middle" font-size="10" fill="#4c1d95">retrieved memory above</text>

  <line x1="145" y1="400" x2="400" y2="428" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="400" x2="440" y2="428" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="655" y1="400" x2="500" y2="428" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Resilience monitor -->
  <rect x="30" y="430" width="230" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="145" y="454" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">Resilience monitor</text>
  <text x="145" y="472" text-anchor="middle" font-size="11" fill="#7f1d1d">connection-drop recovery test +</text>
  <text x="145" y="488" text-anchor="middle" font-size="11" fill="#7f1d1d">continuous health checks against</text>
  <text x="145" y="504" text-anchor="middle" font-size="10" fill="#7f1d1d">the live cluster (see tests/)</text>

  <!-- Lovable frontend -->
  <rect x="330" y="560" width="240" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="450" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">Lovable frontend</text>
  <text x="450" y="602" text-anchor="middle" font-size="11" fill="#0c4a6e">submit case, watch retrieval -&gt;</text>
  <text x="450" y="618" text-anchor="middle" font-size="11" fill="#0c4a6e">reasoning -&gt; decision live</text>

  <line x1="310" y1="120" x2="450" y2="558" stroke="#374151" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="450" y="650" text-anchor="middle" font-size="11" fill="#6b7280">All demo data is synthetic. See README "Tools used" for the honest scope of each component.</text>
</svg>
