<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#111827">CaseMind — Architecture</text>

  <!-- S3 input -->
  <rect x="30" y="70" width="150" height="50" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="105" y="90" text-anchor="middle" font-size="12" fill="#92400e">New case/txn</text>
  <text x="105" y="106" text-anchor="middle" font-size="12" fill="#92400e">lands in S3</text>

  <!-- Lambda -->
  <rect x="250" y="60" width="220" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="360" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e3a8a">AWS Lambda</text>
  <text x="360" y="106" text-anchor="middle" font-size="12" fill="#1e3a8a">(agent orchestration loop)</text>

  <line x1="180" y1="95" x2="248" y2="95" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Three branches -->
  <rect x="60" y="200" width="220" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="170" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CockroachDB MCP Server</text>
  <text x="170" y="242" text-anchor="middle" font-size="11" fill="#14532d">read/write case, entity,</text>
  <text x="170" y="258" text-anchor="middle" font-size="11" fill="#14532d">and decision state</text>
  <text x="170" y="278" text-anchor="middle" font-size="11" fill="#14532d">(audit-logged)</text>

  <rect x="340" y="200" width="220" height="110" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="450" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">CockroachDB</text>
  <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">Vector Index</text>
  <text x="450" y="262" text-anchor="middle" font-size="11" fill="#14532d">semantic search over</text>
  <text x="450" y="278" text-anchor="middle" font-size="11" fill="#14532d">similar case narratives</text>

  <rect x="620" y="200" width="220" height="110" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="730" y="222" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Amazon Bedrock</text>
  <text x="730" y="242" text-anchor="middle" font-size="11" fill="#4c1d95">case reasoning / triage,</text>
  <text x="730" y="258" text-anchor="middle" font-size="11" fill="#4c1d95">informed by retrieved</text>
  <text x="730" y="274" text-anchor="middle" font-size="11" fill="#4c1d95">memory</text>

  <line x1="330" y1="130" x2="200" y2="198" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="360" y1="130" x2="440" y2="198" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="130" x2="700" y2="198" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ccloud CLI -->
  <rect x="60" y="360" width="220" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="170" y="384" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">ccloud CLI health loop</text>
  <text x="170" y="404" text-anchor="middle" font-size="11" fill="#7f1d1d">cluster status, backup</text>
  <text x="170" y="420" text-anchor="middle" font-size="11" fill="#7f1d1d">verification, failover detect</text>

  <line x1="170" y1="310" x2="170" y2="358" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- React frontend -->
  <rect x="60" y="510" width="220" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="170" y="534" text-anchor="middle" font-size="13" font-weight="bold" fill="#0c4a6e">React demo frontend</text>
  <text x="170" y="554" text-anchor="middle" font-size="11" fill="#0c4a6e">submit case, watch agent</text>
  <text x="170" y="570" text-anchor="middle" font-size="11" fill="#0c4a6e">reason + recall live</text>

  <line x1="170" y1="450" x2="170" y2="508" stroke="#374151" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="450" y="600" text-anchor="middle" font-size="11" fill="#6b7280">All demo data is synthetic. Draft — Phase 1 scaffold, subject to review.</text>
</svg>
